name: Release Agent

# Monorepo workflow — identical to single-repo. The Tagline action detects the
# monorepo type (pnpm-workspaces, turborepo, nx, lerna, npm/yarn workspaces)
# from the repo's marker files and bumps each affected package independently.

on:
    workflow_dispatch:
        inputs:
            release_plan:
                description: 'Release plan (provided by Tagline bot)'
                required: true
                type: string
            issue_number:
                required: false
                type: string
                default: ''
            dry_run:
                required: false
                type: boolean
                default: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: tagline-sh/release-agent-action@v1
              with:
                  release_plan: ${{ inputs.release_plan }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  issue_number: ${{ inputs.issue_number }}
                  dry_run: ${{ inputs.dry_run }}
