name: Release Agent

# Tagline runs in two phases against this workflow:
#
#   - Phase A (propose): triggered by `workflow_dispatch` when you `/approve`
#     in a comment. The action bumps versions, writes CHANGELOG.md, pushes a
#     `release/v*` branch, and opens a release PR. **No tag or GitHub Release
#     is created in this phase** — the release is a proposal until you merge.
#
#   - Phase B (finalize): triggered by `pull_request: closed` when the release
#     PR is merged. The action tags the merge commit and publishes the
#     GitHub Release. Closing the PR without merging cancels the release.

on:
    workflow_dispatch:
        inputs:
            release_plan:
                description: 'Release plan (provided by Tagline bot)'
                required: true
                type: string
            issue_number:
                required: false
                type: string
                default: ''
            dry_run:
                required: false
                type: boolean
                default: false
    pull_request:
        types: [closed]
        branches: [main, master]

jobs:
    release:
        # Phase A always runs on workflow_dispatch.
        # Phase B only runs when a merged PR's head branch starts with `release/`
        # — i.e. it was opened by Tagline. Closed-without-merge is a no-op.
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: tagline-sh/release-agent-action@v1
              with:
                  release_plan: ${{ inputs.release_plan }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  issue_number: ${{ inputs.issue_number }}
                  dry_run: ${{ inputs.dry_run }}
