name: Tagline Release Agent

# Tagline runs in two phases against this workflow:
#
#   - Phase A (propose): triggered by `workflow_dispatch` when you `/approve`
#     in a comment. The action bumps versions, writes CHANGELOG.md, pushes a
#     `release/v*` branch, and opens a release PR. **No tag or GitHub Release
#     is created in this phase** — the release is a proposal until you merge.
#
#   - Phase B (finalize): triggered by `push` to the production branch. When
#     the head commit is the merge commit of a `release/v*` PR, the action
#     tags that commit and publishes the GitHub Release. For every other
#     push (regular feature merges), the action no-ops cleanly.
#
# Why `push` and not `pull_request: closed`: PRs opened with the default
# `GITHUB_TOKEN` (which Phase A uses) do NOT fire `pull_request` events when
# merged. This is GitHub's anti-recursion behavior. `push` events fire
# reliably regardless of who opened the merged PR, so Phase B uses them.

on:
    workflow_dispatch:
        inputs:
            release_plan:
                description: "Release plan (provided by Tagline bot)"
                required: true
                type: string
            issue_number:
                required: false
                type: string
                default: ""
            dry_run:
                required: false
                type: boolean
                default: false
    push:
        branches: [main, master]

jobs:
    release:
        # Phase A runs on workflow_dispatch. Phase B runs on every push to the
        # production branch; the action self-filters and no-ops if the head
        # commit isn't a release-PR merge. Skipping pure push noise in the
        # YAML isn't possible (we'd need commit-message access), so we accept
        # the cheap no-op runs instead.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: HelicanHQ/tagline-release-agent-action@v1
              with:
                  release_plan: ${{ inputs.release_plan }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  issue_number: ${{ inputs.issue_number }}
                  dry_run: ${{ inputs.dry_run }}
